# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint, pick this repository, then fill in the values marked "sync: false".
services:
  - type: web
    name: band-rehearsal-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      # e.g. jdbc:mysql://<host>:<port>/band_manager?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Address of the deployed front end, e.g. https://band-rehearsal-manager.vercel.app
      - key: APP_CORS_ALLOWEDORIGINS
        sync: false
      # Random 256-bit key, generated by Render on the first deploy
      - key: APP_JWT_SECRET
        generateValue: true
