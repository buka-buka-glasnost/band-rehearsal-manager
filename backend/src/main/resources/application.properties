spring.application.name=band-rehearsal-manager

# Hosting platforms such as Render pass the port in $PORT
server.port=${PORT:8080}

# --- Database ---------------------------------------------------------------
# Override with SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/band_manager
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Lazy collections (e.g. Musician.bands) are serialized after the service call returns
spring.jpa.open-in-view=true

# --- JWT --------------------------------------------------------------------
# Base64-encoded HMAC key (at least 256 bits). This one is for local development only:
# set APP_JWT_SECRET to your own value anywhere else.
app.jwt.secret=KTpMrhnP5gDoCR+NV6uQfU3bHpKREGOo6yuVu/IlVpz+Y3e2i1j4K/E5/I6W0FXIaBvFoxe6y8vOQIjpne7Jsw==
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# --- CORS -------------------------------------------------------------------
# Comma-separated list of origins allowed to call the API (APP_CORS_ALLOWEDORIGINS)
app.cors.allowed-origins=http://localhost:3000

# --- Demo accounts created on startup when missing --------------------------
app.seed.enabled=true
app.seed.admin-username=admin
app.seed.admin-password=admin123
app.seed.user-username=user
app.seed.user-password=user123
