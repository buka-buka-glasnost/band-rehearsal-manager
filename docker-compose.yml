# Starts MySQL, the Spring Boot API and the Next.js app:  docker compose up --build
#   App: http://localhost:3000   API: http://localhost:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: band_manager
    volumes:
      # Runs only on the first start, while the data volume is still empty
      - ./backend/band_manager.sql:/docker-entrypoint-initdb.d/band_manager.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP ping: succeeds only once the real server (not the init one) is listening
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/band_manager?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_CORS_ALLOWEDORIGINS: http://localhost:3000
      # Set your own signing key outside local development:
      # APP_JWT_SECRET: <base64 key of at least 32 bytes>
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
